<!DOCTYPE html>
<html>

<head>
    <title>Smart Todo Dashboard</title>
    <link rel="stylesheet" href="todo.css">
</head>

<body>
    <div class="container">

        <h1>Smart Todo Dashboard</h1>
        <input type="text" id="taskInput" placeholder="Enter task">

        <button id="addBtn">Add task</button>
        <button id="showAll">All</button>
        <button id="showCompleted">Completed</button>
        <button id="showPending">Pending</button>
        <button id="darkModeBtn">Dark Mode</button>

        <input type="text" id="searchInput" placeholder="Search task">

        <h3 id="taskCount"></h3>
        <ul id="taskList"></ul>
    </div>
    <script src="todo.js"></script>
</body>

</html>
